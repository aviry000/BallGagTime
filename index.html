<!DOCTYPE html>
<html lang="zh-TW" data-theme="abyss">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080d">
<title>深淵規訓終端・授權驗證門戶</title>
<style>
  :root {
    --bg: #08080d;
    --card: rgba(20, 20, 30, 0.92);
    --border: rgba(255, 255, 255, 0.12);
    --red: #ff334b;
    --gold: #ffd000;
    --blue: #00d2ff;
    --green: #00e676;
    --purple: #9d4edd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
  
  body {
    background: var(--bg);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background-image: 
      radial-gradient(circle at 50% 20%, rgba(255, 51, 75, 0.12) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 210, 255, 0.08) 0%, transparent 40%);
    overflow: hidden;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 51, 75, 0.15);
    backdrop-filter: blur(10px);
    transition: transform 0.3s, box-shadow 0.3s;
    position: relative;
  }

  .login-card::before {
    content: "";
    position: absolute;
    top: -1px; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }

  .logo-icon {
    font-size: 42px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 10px var(--red));
    animation: pulseGlow 3s infinite ease-in-out;
  }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px var(--red)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 16px var(--purple)); }
  }

  h1 {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #fff, #bbb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 11px;
    color: #888;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
    line-height: 1.4;
  }

  .input-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 14px;
  }

  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 12px 40px 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(13, 13, 21, 0.95);
    color: #fff;
    font-size: 14px;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--red);
    box-shadow: 0 0 10px rgba(255, 51, 75, 0.3);
  }

  .toggle-pw-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #777;
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
  }

  .btn-enter {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #ff334b, #d32f2f);
    color: #fff;
    font-size: 13.5px;
    font-weight: bold;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 51, 75, 0.4);
    transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
  }

  .btn-enter:hover {
    box-shadow: 0 6px 20px rgba(255, 51, 75, 0.6);
  }

  .btn-enter:active {
    transform: scale(0.98);
  }

  .status-msg {
    margin-top: 12px;
    font-size: 11.5px;
    min-height: 18px;
    font-weight: bold;
    transition: all 0.2s;
  }

  .shake {
    animation: shakeAnim 0.4s ease-in-out;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .footer-note {
    margin-top: 24px;
    font-size: 10px;
    color: #555;
    line-height: 1.5;
  }

  .badge-tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: bold;
    background: rgba(255, 51, 75, 0.15);
    color: #ff8a80;
    border: 1px solid rgba(255, 51, 75, 0.3);
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<div class="login-card" id="loginCard">
  <div class="logo-icon">🔒</div>
  <span class="badge-tag">RESTRAINT TERMINAL v3.5</span>
  <h1>口球懲罰與服從計時器</h1>
  <div class="subtitle">Grand Master 3D・深淵神經規訓終端<br>請輸入通行密碼以驗證身分授權</div>

  <div class="input-wrapper">
    <input type="password" id="pwInput" placeholder="請輸入訪問通行密碼..." autocomplete="current-password" onkeydown="handleKey(event)">
    <button class="toggle-pw-btn" type="button" onclick="togglePasswordVisibility()" id="toggleBtn">👁️</button>
  </div>

  <button class="btn-enter" onclick="verifyPassword()">驗證進入終端 (ENTER)</button>
  <div id="statusMsg" class="status-msg"></div>

  <div class="footer-note">
    SYSTEM PROTECTED & ENCRYPTED<br>
    未授權訪客請立即離開終端
  </div>
</div>

<script>
// 通行密碼定義
const TARGET_PASS = "aviry0905";

// 目標主程式網頁檔案名稱 (位於 GitHub 倉庫同級目錄)
const TARGET_PAGE = "GagTime.html";

function handleKey(e) {
  if (e.key === "Enter") {
    verifyPassword();
  }
}

function togglePasswordVisibility() {
  const inp = document.getElementById("pwInput");
  const btn = document.getElementById("toggleBtn");
  if (inp.type === "password") {
    inp.type = "text";
    btn.innerText = "🙈";
  } else {
    inp.type = "password";
    btn.innerText = "👁️";
  }
}

function verifyPassword() {
  const inp = document.getElementById("pwInput");
  const card = document.getElementById("loginCard");
  const val = (inp.value || "").trim();

  if (!val) {
    showStatus("⚠️ 請輸入通行密碼！", "#ff9800");
    triggerShake(card);
    return;
  }

  if (val === TARGET_PASS) {
    // 驗證成功：記錄授權狀態並跳轉
    sessionStorage.setItem("TERMINAL_AUTH", "GRANTED");
    showStatus("✔ 密碼驗證通過，正在載入深淵終端...", "var(--green)");
    inp.disabled = true;
    
    setTimeout(() => {
      window.location.href = TARGET_PAGE;
    }, 600);
  } else {
    // 驗證失敗
    showStatus("❌ 密碼錯誤！存取請求遭拒絕。", "var(--red)");
    triggerShake(card);
    inp.value = "";
    inp.focus();
  }
}

function showStatus(text, color) {
  const el = document.getElementById("statusMsg");
  if (el) {
    el.innerText = text;
    el.style.color = color;
  }
}

function triggerShake(el) {
  el.classList.remove("shake");
  void el.offsetWidth; // 強制重繪觸發動畫
  el.classList.add("shake");
}

window.addEventListener("DOMContentLoaded", () => {
  const inp = document.getElementById("pwInput");
  if (inp) inp.focus();
});
</script>
</body>
</html>
